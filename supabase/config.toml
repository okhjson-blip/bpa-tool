project_id = "bpa-tool"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = []
enable_anonymous_sign_ins = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 900
# 협력사 로그인은 이메일 OTP 코드를 사용한다. Supabase 대시보드의 Magic Link
# 메일 템플릿에 {{ .Token }} 이 포함되어 있어야 코드가 발송된다.

[functions.admin-password-verify]
verify_jwt = false
